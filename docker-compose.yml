services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deployhub}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-https://deployhub.prashant.in}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-https://deployhub.prashant.in/api/auth/github/callback}
      DEPLOYMENT_DOMAIN: ${DEPLOYMENT_DOMAIN:-deployhub.prashant.in}
      DEPLOYMENT_PROTOCOL: ${DEPLOYMENT_PROTOCOL:-https}
      DEPLOYMENT_DOCKER_NETWORK: deployhub_deployments
      DEPLOYMENT_NGINX_CONTAINER: deployhub-nginx
      DEPLOYMENT_NGINX_CONFIG_DIR: /deployment-nginx
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - deployment_routes:/deployment-nginx
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: deployhub-nginx
    restart: unless-stopped
    environment:
      DEPLOYMENT_DOMAIN: ${DEPLOYMENT_DOMAIN:-deployhub.prashant.in}
      NGINX_ENVSUBST_FILTER: ^DEPLOYMENT_DOMAIN$
    depends_on:
      server:
        condition: service_healthy
      client:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - deployment_routes:/etc/nginx/deployments:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/letsencrypt:ro
    networks:
      - default
      - deployments

volumes:
  postgres_data:
  deployment_routes:

networks:
  default:
    name: deployhub_default
  deployments:
    name: deployhub_deployments